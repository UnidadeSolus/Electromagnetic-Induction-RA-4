
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidade Aumentada - Indução Eletromagnética</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      font: 14px Arial, sans-serif;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">Iniciando realidade aumentada...</div>

  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-4/main/IFRJ.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets timeout="20000">
      <a-asset-item
        id="magneticFieldModel"
        src="https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-4/main/Electromagnetic-Induction-3D.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="magneticField"
        src="#magneticFieldModel"
        position="0 0 0.12"
        rotation="0 0 0"
        scale="0.30 0.30 0.30">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const model = document.getElementById("magneticField");

    scene.addEventListener("loaded", () => {
      status.textContent = "Cena iniciada. Aponte para o marcador IFRJ.";
    });

    scene.addEventListener("arReady", () => {
      status.textContent = "Câmera pronta. Procure o marcador IFRJ.";
    });

    scene.addEventListener("arError", (event) => {
      status.textContent = "Erro na inicialização da realidade aumentada.";
      console.error("Erro MindAR:", event);
    });

    scene.addEventListener("targetFound", () => {
      status.textContent = "Marcador encontrado! Verificando o modelo 3D...";
    });

    scene.addEventListener("targetLost", () => {
      status.textContent = "Marcador perdido. Aponte novamente.";
    });

    model.addEventListener("model-loaded", () => {
      status.textContent = "Modelo 3D carregado!";
      console.log("Modelo GLB carregado:", model.getObject3D("mesh"));
    });

    model.addEventListener("model-error", (event) => {
      status.textContent = "Falha ao carregar o modelo GLB. Consulte o console.";
      console.error("Erro no carregamento do GLB:", event);
    });
  </script>
</body>
</html>
