<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realidade Aumentada - Indução Eletromagnético</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-4/main/IFRJ.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="magneticFieldModel"
        src="https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-4/main/Electromagnetic-Induction-3D.glb"
        crossorigin="anonymous">
      </a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- O marcador físico é usado apenas para rastreamento; não desenha uma cópia por cima. -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        id="magneticField"
        src="#magneticFieldModel"
        position="0 0 0.12"
        rotation="0 0 0"
        scale="0.30 0.30 0.30"
        animation-mixer="clip: *; loop: repeat; timeScale: 1">
      </a-gltf-model>
    </a-entity>

  </a-scene>
</body>
</html>
