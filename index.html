```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidade Aumentada - Indução Eletromagnética</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      font: 14px Arial, sans-serif;
      border-radius: 8px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="status">Iniciando realidade aumentada...</div>

  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-4/main/IFRJ.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets timeout="30000">
      <a-asset-item
        id="magneticFieldModel"
        src="https://raw.githubusercontent.com/UnidadeSolus/Electromagnetic-Induction-RA-4/main/Electromagnetic-Induction-3D.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-gltf-model
        id="magneticField"
        src="#magneticFieldModel"
        position="0 0 0.12"
        rotation="0 0 0"
        scale="1 1 1"
        animation-mixer="clip: *; loop: repeat; timeScale: 1">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const model = document.getElementById("magneticField");

    let markerFound = false;
    let modelLoaded = false;

    function updateStatus() {
      if (markerFound && modelLoaded) {
        status.textContent =
          "Marcador encontrado! Modelo 3D carregado. Verifique a visualização.";
      } else if (markerFound && !modelLoaded) {
        status.textContent =
          "Marcador encontrado! Aguardando o carregamento do modelo 3D...";
      } else if (!markerFound && modelLoaded) {
        status.textContent =
          "Modelo 3D carregado. Aponte a câmera para o marcador IFRJ.";
      }
    }

    scene.addEventListener("loaded", () => {
      status.textContent =
        "Cena iniciada. Aguardando a câmera e o modelo 3D...";
    });

    scene.addEventListener("arReady", () => {
      status.textContent =
        "Câmera pronta. Aponte para o marcador IFRJ.";
    });

    scene.addEventListener("arError", (event) => {
      status.textContent =
        "Erro na inicialização da realidade aumentada.";
      console.error("Erro MindAR:", event);
    });

    scene.addEventListener("targetFound", () => {
      markerFound = true;
      updateStatus();
      console.log("Marcador IFRJ encontrado!");
    });

    scene.addEventListener("targetLost", () => {
      markerFound = false;
      updateStatus();
      console.log("Marcador perdido.");
    });

    model.addEventListener("model-loaded", () => {
      modelLoaded = true;

      // Escala temporária de teste: aumentada para facilitar a visualização.
      model.setAttribute("scale", "1 1 1");

      // Informa quantas animações estão disponíveis no arquivo.
      const gltf = model.getObject3D("mesh");
      const animations = gltf && gltf.animations
        ? gltf.animations
        : [];

      console.log("Modelo GLB carregado:", gltf);
      console.log("Quantidade de animações:", animations.length);
      console.log(
        "Animações disponíveis:",
        animations.map(animation => animation.name)
      );

      if (animations.length > 0) {
        status.textContent =
          "Modelo carregado! " + animations.length +
          " animação(ões) encontrada(s).";
      } else {
        status.textContent =
          "Modelo carregado, mas o arquivo não contém animações.";
      }

      updateStatus();
    });

    model.addEventListener("model-error", (event) => {
      status.textContent =
        "Erro ao carregar o modelo 3D. Verifique o endereço do GLB.";
      console.error("Erro no carregamento do GLB:", event);
    });

    // Detecta erros gerais que podem ajudar no diagnóstico.
    window.addEventListener("error", (event) => {
      console.error("Erro JavaScript:", event.message);
    });
  </script>
</body>
</html>
